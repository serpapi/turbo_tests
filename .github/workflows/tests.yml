name: Tests

on:
  pull_request:
  push:
    branches: [master, 2-x-stable]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.4', '2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', head]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - os: macos-latest
            ruby: '2.4'
          - os: macos-latest
            ruby: '2.5'
          - os: macos-latest
            ruby: '2.6'
          - os: windows-latest
            ruby: '2.4'
          - os: windows-latest
            ruby: '2.5'
          - os: windows-latest
            ruby: '2.6'
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run rspec
        timeout-minutes: 10
        run: bundle exec rspec
      - name: Dogfood turbo_tests
        timeout-minutes: 10
        run: bundle exec turbo_tests -n 4 spec

  alternative-rubies:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby, truffleruby]
    steps:
      - uses: actions/checkout@v5
      # JRuby 10 is compiled for Java 21; the runner's default JDK is 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run spawn pool
        timeout-minutes: 10
        run: bundle exec turbo_tests --pool spawn -n 2 spec

  syntax-2-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check Ruby 2.4 syntax
        run: bundle exec bin/check_ruby24_syntax

  simplecov:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run with SimpleCov if supported
        timeout-minutes: 10
        env:
          SIMPLECOV: '1'
        run: bundle exec turbo_tests -n 2 spec

  command-pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run command pool executable override
        timeout-minutes: 10
        env:
          RSPEC_EXECUTABLE: bundle exec rspec
        run: bundle exec turbo_tests --pool command -n 4 spec

  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install perf tools best-effort
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic bpftrace || true
      - name: Run benchmarks
        run: |
          set +e
          bundle exec bin/benchmark --runs 3 --json bench.json
          bench_status=$?
          bundle exec bin/leak_check
          leak_status=$?
          exit $(( bench_status > leak_status ? bench_status : leak_status ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-artifacts
          path: |
            bench.json
            fixtures/benchmark/
